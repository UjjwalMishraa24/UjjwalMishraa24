name: generate contribution snake

on:
  schedule:
    - cron: "17 0 * * *"  # once a day, off the hour so GitHub doesn't queue it
  workflow_dispatch: {}    # lets you trigger it manually from the Actions tab
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: generate snake svg
        uses: Platane/snk@v3
        with:
          github_user_name: ujjwalmishraa24
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
            dist/github-contribution-grid-snake.svg

      - name: fetch activity graph svg
        # One scheduled fetch a day instead of one per profile view —
        # keeps us far away from the public instance's rate limits.
        # continue-on-error so a transient failure never blocks the snake.
        continue-on-error: true
        run: |
          curl --fail --retry 3 --retry-delay 10 -o dist/github-activity-graph.svg \
            "https://github-readme-activity-graph.vercel.app/graph?username=ujjwalmishraa24&theme=tokyo-night&hide_border=true&bg_color=00000000&color=7aa2f7&line=7aa2f7&point=a9b1d6"
          test -s dist/github-activity-graph.svg

      - name: push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
